name: securedev-estudiante

services:
  app:
    build: .
    environment:
      DATABASE_PATH: /data/securedev.db
      # V-03: el secreto ya NO está hardcodeado; se exige por el entorno del host.
      # Levantar con:  SECRET_KEY=$(openssl rand -hex 32) docker compose up -d --build
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el entorno antes de levantar}
      HOST: 0.0.0.0
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  app_data:
